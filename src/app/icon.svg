<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#grad)"/>

  <!-- Graduation cap - board (diamond shape) -->
  <polygon points="50,20 80,35 50,50 20,35" fill="white" opacity="0.95"/>

  <!-- Cap top highlight -->
  <polygon points="50,20 80,35 50,50 20,35" fill="none" stroke="white" stroke-width="1" opacity="0.4"/>

  <!-- Left side of mortarboard body -->
  <polygon points="20,35 35,42.5 35,62 20,54" fill="white" opacity="0.75"/>

  <!-- Right side of mortarboard body (not visible from this angle - just left visible) -->
  <!-- Cap base / diploma roll hint -->
  <rect x="35" y="42" width="30" height="20" rx="2" fill="white" opacity="0.75"/>

  <!-- Play button inside the cap body -->
  <polygon points="43,48 43,58 55,53" fill="url(#grad)" opacity="0.9"/>

  <!-- Tassel string -->
  <line x1="80" y1="35" x2="80" y2="55" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Tassel end -->
  <circle cx="80" cy="57" r="3" fill="white" opacity="0.85"/>
  <!-- Tassel strands -->
  <line x1="78" y1="57" x2="76" y2="65" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="80" y1="57" x2="80" y2="66" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="82" y1="57" x2="84" y2="65" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Stream waves at bottom (signal/streaming arcs) -->
  <path d="M 32 76 Q 50 70 68 76" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 38 82 Q 50 78 62 82" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
